<!doctype html>
<html lang="en-GB">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #f7f7f8;
        --surface: #ffffff;
        --fg: #18181b;
        --muted: #52525b;
        --subtle: #e4e4e7;
        --primary: #2d0054;
        --success: #15803d;
        --success-soft: #ecfdf3;
        --warning: #92400e;
        --warning-soft: #fff7e0;
        --danger: #b91c1c;
        --danger-soft: #fef2f2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
      .card { background: var(--surface); border: 1px solid var(--subtle); padding: 24px 16px; }
      .eyebrow { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
      h1 { margin: 0 0 16px; font-size: 25px; line-height: 1.25; letter-spacing: -0.01em; }
      h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; }
      .when { margin: 0 0 24px; padding: 8px 16px; background: var(--bg); border-left: 4px solid var(--primary); }
      .when b { display: block; }
      button, .button {
        display: block; width: 100%; min-height: 56px; margin: 0 0 8px; padding: 16px;
        border: 2px solid var(--fg); background: var(--surface); color: var(--fg);
        font: inherit; font-weight: 600; text-align: center; cursor: pointer;
      }
      button.yes { background: var(--success); border-color: var(--success); color: #fff; font-size: 20px; }
      button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
      button.link { min-height: 48px; border: 0; background: none; color: var(--primary); text-decoration: underline; }
      button:disabled { opacity: 0.5; cursor: wait; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, label.option:focus-within {
        outline: 2px solid var(--primary); outline-offset: 2px;
      }
      .note { margin: 16px 0 0; font-size: 14px; color: var(--muted); }
      .error { margin: 0 0 16px; padding: 8px 16px; background: var(--danger-soft); color: var(--danger); border-left: 4px solid var(--danger); }
      .error:empty { display: none; }
      fieldset { margin: 0 0 16px; padding: 0; border: 0; }
      legend { margin: 0 0 8px; font-weight: 600; }
      label.option {
        display: flex; gap: 16px; align-items: center; min-height: 56px; padding: 8px 16px;
        border: 1px solid var(--subtle); border-bottom: 0; cursor: pointer;
      }
      label.option:last-of-type { border-bottom: 1px solid var(--subtle); }
      label.option input { width: 24px; height: 24px; margin: 0; accent-color: var(--primary); }
      .field label { font-weight: 600; }
      .hint { margin: 0; font-size: 14px; color: var(--muted); }
      textarea {
        width: 100%; min-height: 104px; padding: 8px; border: 1px solid var(--muted); background: var(--surface);
        font: inherit; color: var(--fg);
      }
      .changes { margin: 24px 0 0; padding: 24px 0 0; border-top: 1px solid var(--subtle); text-align: left; }
      .changes > .note { margin: 0 0 16px; }
      .field { display: grid; gap: 8px; margin: 0 0 16px; }
      .done { text-align: center; }
      .tick {
        width: 72px; height: 72px; margin: 0 auto 16px; display: grid; place-items: center;
        background: var(--success); color: #fff; font-size: 40px; border-radius: 50%;
      }
      .summary { margin: 0 0 16px; padding: 8px 16px; background: var(--success-soft); text-align: left; }
      .warn { background: var(--warning-soft); color: var(--warning); border-left: 4px solid var(--warning); padding: 8px 16px; margin: 0 0 16px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="card" id="app" aria-live="polite"></div>
    </main>

    <script>
      var DATA = <?!= jsonForPage(data) ?>;
      var app = document.getElementById("app");

      function el(tag, attrs, children) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) {
          if (k === "text") node.textContent = attrs[k];
          else if (k === "onclick") node.addEventListener("click", attrs[k]);
          else node.setAttribute(k, attrs[k]);
        });
        (children || []).forEach(function (c) { if (c) node.appendChild(c); });
        return node;
      }

      function heading() {
        return [
          el("p", { class: "eyebrow", text: "Hi " + DATA.name + " · session check-in" }),
          el("h1", { text: "Did session " + DATA.session + " happen as planned?" }),
          el("p", { class: "when" }, [el("b", { text: DATA.when }), document.createTextNode(DATA.project)]),
        ];
      }

      function show(nodes) {
        app.innerHTML = "";
        nodes.forEach(function (n) { if (n) app.appendChild(n); });
        window.scrollTo(0, 0);
      }

      function send(answer, button) {
        if (button) button.disabled = true;
        var error = document.getElementById("error");
        if (error) error.textContent = "";
        google.script.run
          .withSuccessHandler(function (result) { thanks(result); })
          .withFailureHandler(function (err) {
            if (button) button.disabled = false;
            var message = (err && err.message) || "That didn't send. Check your signal and try again.";
            var box = document.getElementById("error");
            if (box) box.textContent = message;
            else failed(message);
          })
          .submitCheckIn(DATA.key, answer);
      }

      function failed(message) {
        var retry = el("button", { class: "yes", text: "Try again" });
        retry.addEventListener("click", function () { send({ asPlanned: true }, retry); });
        show(heading().concat([el("p", { class: "error", id: "error", role: "alert", text: message }), retry]));
      }

      // The link records "it went ahead" as soon as it opens.
      function confirmYes() {
        if (DATA.status) return answered();
        if (!DATA.started) {
          show(heading().concat([
            el("p", { class: "warn", text: "This session hasn't finished yet. Open this link again once it has." }),
            changes("Was it moved or cancelled?", "Only fill this in if so."),
          ]));
          return;
        }
        show([
          el("p", { class: "eyebrow", text: "Hi " + DATA.name + " · session check-in" }),
          el("h1", { text: "Confirming session " + DATA.session + "…" }),
          el("p", { class: "when" }, [el("b", { text: DATA.when }), document.createTextNode(DATA.project)]),
        ]);
        send({ asPlanned: true });
      }

      // Opening the link again after answering.
      function answered() {
        var nodes = heading().concat([
          el("p", { class: "summary" }, [
            el("b", { text: "You answered on " + DATA.answeredAt + ": " + DATA.status }),
            DATA.summary && DATA.summary !== "As planned" ? el("span", { text: " · " + DATA.summary }) : null,
          ]),
        ]);
        if (DATA.status !== "Delivered") {
          var yes = el("button", { class: "yes", text: "It went ahead as planned" });
          yes.addEventListener("click", function () { send({ asPlanned: true, replace: true }, yes); });
          nodes.push(yes);
        }
        nodes.push(changes("Anything to add or change?", "A new answer replaces the one in the sheet. Both stay in the log."));
        show(nodes);
      }

      // Tick boxes, one text box and Submit.
      function changes(title, hint) {
        var form = el("form", { class: "changes", novalidate: "novalidate" });
        var boxes = el("fieldset", {}, [el("legend", { text: "Tick what changed" })]);
        DATA.changes.forEach(function (c) {
          boxes.appendChild(el("label", { class: "option" }, [
            el("input", { type: "checkbox", name: "change", value: c[0] }),
            el("span", { text: c[1] }),
          ]));
        });
        var details = el("textarea", { id: "details", name: "details", maxlength: "1000", "aria-describedby": "details-hint" });
        var submit = el("button", { type: "button", class: "primary", text: "Submit" });
        [
          el("h2", { text: title }),
          el("p", { class: "note", text: hint }),
          boxes,
          el("div", { class: "field" }, [
            el("label", { for: "details", text: "What happened?" }),
            el("p", { class: "hint", id: "details-hint", text: "For example: started 20 minutes late, or £6.80 bus fare." }),
            details,
          ]),
          el("p", { class: "error", id: "error", role: "alert" }),
          submit,
        ].forEach(function (n) { form.appendChild(n); });

        form.addEventListener("input", function () {
          var box = document.getElementById("error");
          if (box) box.textContent = "";
        });
        // Submit runs on a tap, not a form submission, so it still works where a frame blocks forms.
        form.addEventListener("submit", function (e) { e.preventDefault(); });
        submit.addEventListener("click", function () {
          var ticked = [].slice.call(form.querySelectorAll("input[name=change]:checked")).map(function (b) { return b.value; });
          send({ asPlanned: false, changes: ticked, details: details.value }, submit);
        });
        return form;
      }

      // The change link (the coordinator's copy), or "Change this answer".
      function changeForm() {
        show([
          el("p", { class: "eyebrow", text: "Hi " + DATA.name + " · session " + DATA.session + " · " + DATA.when }),
          el("h1", { text: "What changed?" }),
          changes("Tell us what was different", "Tick everything that applies."),
        ]);
      }

      function thanks(result) {
        DATA.status = result.status;
        DATA.summary = result.summary;
        var delivered = result.summary === "As planned";
        var line = result.already
          ? "You'd already told us: " + result.status + (delivered || !result.summary ? "." : " · " + result.summary)
          : delivered
            ? "Session " + DATA.session + " is marked as delivered."
            : "We've recorded: " + result.summary;
        var done = el("div", { class: "done" }, [
          el("div", { class: "tick", "aria-hidden": "true", text: "✓" }),
          el("h1", { text: "Thanks, " + DATA.name + "." }),
          el("p", { class: "summary", text: line }),
        ]);
        if (delivered) {
          show([done, changes("Did anything change?", "Only fill this in if something was different. Otherwise you can close this page.")]);
        } else {
          done.appendChild(el("p", { class: "note", text: "You can close this page." }));
          done.appendChild(el("button", { type: "button", class: "link", text: "Change this answer", onclick: changeForm }));
          show([done]);
        }
      }

      if (!DATA) {
        show([
          el("h1", { text: "This link doesn't work" }),
          el("p", { text: "It may be old or mistyped. Ask your coordinator to send it again." }),
        ]);
      } else if (DATA.mode === "change") {
        changeForm();
      } else {
        confirmYes();
      }
    </script>
  </body>
</html>
